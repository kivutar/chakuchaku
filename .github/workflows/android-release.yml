name: Build Android release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to build
        required: true
        default: main
        type: string
      version_name:
        description: Android version name (for example 1.0.11)
        required: true
        type: string
      github_release_tag:
        description: Optional existing GitHub release tag for APK/AAB assets
        required: false
        type: string
      publish_to_google_play:
        description: Publish the AAB to Google Play internal and closed Alpha testing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name || inputs.version_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Sync native application
        run: npm run native:sync

      - name: Prepare release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          version_name="${VERSION_NAME_INPUT:-${RELEASE_TAG#v}}"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Use a numeric Android version such as 1.0.11." >&2
            exit 1
          fi
          asset_tag="$(printf '%s' "${RELEASE_TAG:-v${version_name}}" | tr -c 'A-Za-z0-9._-' '-')"
          version_code="$((GITHUB_RUN_NUMBER + 1000))"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"
          printf 'apk_asset_name=ChakuChaku-%s.apk\n' "$asset_tag" >> "$GITHUB_OUTPUT"
          printf 'aab_asset_name=ChakuChaku-%s.aab\n' "$asset_tag" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing_secret=false
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "$secret_name is not configured." >&2
              missing_secret=true
            fi
          done
          if [ "$missing_secret" = true ]; then
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chakuchaku-release.jks"
          chmod 600 "$RUNNER_TEMP/chakuchaku-release.jks"

      - name: Build signed Android release artifacts
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chakuchaku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner_path" ]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$APK_PATH"

      - name: Verify app bundle signature
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: jarsigner -verify "$AAB_PATH"

      - name: Check Google Play publishing credentials
        id: google_play
        if: github.event_name == 'release' || inputs.publish_to_google_play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured; the signed artifacts will be attached to the GitHub Release without uploading to Google Play."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish AAB to Google Play internal and closed Alpha testing
        if: steps.google_play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kivutar.chakuchaku
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
          releaseName: ChakuChaku ${{ steps.release.outputs.version_name }}

      - name: Preserve Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ChakuChaku-${{ steps.release.outputs.version_name }}-Android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Attach Android artifacts to GitHub Release
        if: github.event_name == 'release' || inputs.github_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.github_release_tag }}
          APK_ASSET_NAME: ${{ steps.release.outputs.apk_asset_name }}
          AAB_ASSET_NAME: ${{ steps.release.outputs.aab_asset_name }}
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: |
          cp "$APK_PATH" "$RUNNER_TEMP/$APK_ASSET_NAME"
          cp "$AAB_PATH" "$RUNNER_TEMP/$AAB_ASSET_NAME"
          gh release upload \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/$APK_ASSET_NAME" \
            "$RUNNER_TEMP/$AAB_ASSET_NAME" \
            --clobber
